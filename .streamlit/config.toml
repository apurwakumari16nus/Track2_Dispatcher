# Light operational canvas with a navy shell. Component styling: src/ui/theme.css.
[theme]
base = "light"
primaryColor = "#3E5FD9"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EEF3F7"
textColor = "#142334"
borderColor = "#C9D4DE"
linkColor = "#3E5FD9"
font = "Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Aptos, system-ui, sans-serif"
codeFont = "'SF Mono', ui-monospace, Menlo, Consolas, monospace"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = false
dataframeHeaderBackgroundColor = "#F8FAFC"
dataframeBorderColor = "#DDE5EC"
codeBackgroundColor = "#F8FAFC"
greenColor = "#177D4A"
orangeColor = "#8F5A0B"
redColor = "#B83A33"
blueColor = "#3E5FD9"
chartCategoricalColors = ["#4F6FE8", "#12998A", "#E8692F", "#8B6CE0", "#2E8BC0"]

[theme.sidebar]
backgroundColor = "#091A2D"
secondaryBackgroundColor = "#0E2238"
textColor = "#E8EEF5"
borderColor = "#21364F"
primaryColor = "#3ACED8"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
