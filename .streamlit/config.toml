# Quick Response Desk: light canvas, midnight navy shell. Component styling: src/ui/theme.css.
[theme]
base = "light"
primaryColor = "#4561E0"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#122233"
borderColor = "#CBD6E1"
linkColor = "#4561E0"
font = "Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif"
codeFont = "'SF Mono', ui-monospace, Menlo, Consolas, monospace"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = false
dataframeHeaderBackgroundColor = "#F7F9FC"
dataframeBorderColor = "#E1E8EF"
codeBackgroundColor = "#F7F9FC"
greenColor = "#167F4C"
orangeColor = "#8C5A06"
redColor = "#B53A33"
blueColor = "#4561E0"
chartCategoricalColors = ["#5F78F5", "#149E8B", "#E8692F", "#8B6CE0", "#2E8BC0"]

[theme.sidebar]
backgroundColor = "#071524"
secondaryBackgroundColor = "#0B1F32"
textColor = "#EAF1F8"
borderColor = "#21364F"
primaryColor = "#48D9E6"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
