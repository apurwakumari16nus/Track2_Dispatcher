<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .t  { font-size: 19px; font-weight: 700; fill: #111827; }
      .b  { font-size: 14px; fill: #1f2937; }
      .s  { font-size: 12px; fill: #4b5563; }
      .c  { font-size: 10.5px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
      .tt { font-size: 14px; font-weight: 700; fill: #1e3a5f; }
      .lbl{ font-size: 13px; fill: #374151; }
      .h  { font-size: 17px; font-weight: 700; fill: #1e3a5f; }
    </style>
  </defs>

  <rect width="1600" height="950" fill="#ffffff"/>

  <!-- Title + legend -->
  <text x="20" y="42" font-size="26" font-weight="700" fill="#1e3a5f">System Architecture — LLM Intake + Rule-Based Dispatcher</text>
  <rect x="1300" y="24" width="18" height="18" rx="3" fill="#ede4fb" stroke="#7c4dcc"/>
  <text x="1325" y="38" class="lbl">LLM</text>
  <rect x="1375" y="24" width="18" height="18" rx="3" fill="#e6f0fb" stroke="#4a78b5"/>
  <text x="1400" y="38" class="lbl">Rule-based (no LLM)</text>

  <!-- Tools container -->
  <rect x="150" y="70" width="1080" height="160" rx="12" fill="#f3f7fc" stroke="#9db4d3" stroke-dasharray="6 5"/>
  <text x="690" y="97" text-anchor="middle" class="h">8 Tools (rule-based, no LLM)</text>
  <rect x="167" y="110" width="122" height="105" rx="8" fill="#e6f0fb" stroke="#4a78b5"/>
  <text x="228" y="134" text-anchor="middle" class="tt">Eligibility</text>
  <text x="228" y="156" text-anchor="middle" class="s">can make? allowed?</text>
  <text x="228" y="172" text-anchor="middle" class="s">under batch cap?</text>
  <text x="228" y="200" text-anchor="middle" class="c">check_eligibility</text>
  <rect x="299" y="110" width="122" height="105" rx="8" fill="#e6f0fb" stroke="#4a78b5"/>
  <text x="360" y="134" text-anchor="middle" class="tt">Candidate List</text>
  <text x="360" y="156" text-anchor="middle" class="s">eligible shops with</text>
  <text x="360" y="172" text-anchor="middle" class="s">ETA + cost, sorted</text>
  <text x="360" y="200" text-anchor="middle" class="c">candidates</text>
  <rect x="431" y="110" width="122" height="105" rx="8" fill="#e6f0fb" stroke="#4a78b5"/>
  <text x="492" y="134" text-anchor="middle" class="tt">Queue Check</text>
  <text x="492" y="156" text-anchor="middle" class="s">days of work</text>
  <text x="492" y="172" text-anchor="middle" class="s">already held</text>
  <text x="492" y="200" text-anchor="middle" class="c">queue_check</text>
  <rect x="563" y="110" width="122" height="105" rx="8" fill="#e6f0fb" stroke="#4a78b5"/>
  <text x="624" y="134" text-anchor="middle" class="tt">ETA Estimate</text>
  <text x="624" y="156" text-anchor="middle" class="s">queue + make</text>
  <text x="624" y="172" text-anchor="middle" class="s">+ transport</text>
  <text x="624" y="200" text-anchor="middle" class="c">estimate_eta</text>
  <rect x="695" y="110" width="122" height="105" rx="8" fill="#e6f0fb" stroke="#4a78b5"/>
  <text x="756" y="134" text-anchor="middle" class="tt">Cost Estimate</text>
  <text x="756" y="156" text-anchor="middle" class="s">pieces × rate</text>
  <text x="756" y="172" text-anchor="middle" class="s">per workshop</text>
  <text x="756" y="200" text-anchor="middle" class="c">estimate_cost</text>
  <rect x="827" y="110" width="122" height="105" rx="8" fill="#e6f0fb" stroke="#4a78b5"/>
  <text x="888" y="134" text-anchor="middle" class="tt">Overload Probe</text>
  <text x="888" y="156" text-anchor="middle" class="s">queue impact if</text>
  <text x="888" y="172" text-anchor="middle" class="s">we send it here</text>
  <text x="888" y="200" text-anchor="middle" class="c">overload_probe</text>
  <rect x="959" y="110" width="122" height="105" rx="8" fill="#e6f0fb" stroke="#4a78b5"/>
  <text x="1020" y="134" text-anchor="middle" class="tt">Split Estimate</text>
  <text x="1020" y="156" text-anchor="middle" class="s">fastest legal</text>
  <text x="1020" y="172" text-anchor="middle" class="s">two-shop split</text>
  <text x="1020" y="200" text-anchor="middle" class="c">estimate_split</text>
  <rect x="1091" y="110" width="122" height="105" rx="8" fill="#e6f0fb" stroke="#4a78b5"/>
  <text x="1152" y="134" text-anchor="middle" class="tt">Order Lookup</text>
  <text x="1152" y="156" text-anchor="middle" class="s">real matching orders</text>
  <text x="1152" y="172" text-anchor="middle" class="s">for follow-up Qs</text>
  <text x="1152" y="200" text-anchor="middle" class="c">order_options</text>

  <!-- Allocator (decision, not a tool) -->
  <rect x="1265" y="70" width="315" height="160" rx="12" fill="#dbe8f8" stroke="#2f5f9e" stroke-width="1.8"/>
  <text x="1422" y="100" text-anchor="middle" class="t">Allocator</text>
  <text x="1422" y="119" text-anchor="middle" class="s">picks the workshop</text>
  <text x="1283" y="146" class="b">• Scores each candidate by</text>
  <text x="1295" y="164" class="b">objective weights (config)</text>
  <text x="1283" y="187" class="b">• Least-late fallback if none on time</text>
  <text x="1283" y="210" class="b">• Closure monitor flags stuck queues</text>

  <!-- Tools <-> Dispatcher -->
  <line x1="700" y1="234" x2="700" y2="286" stroke="#1f2937" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="712" y="265" class="lbl">tool calls / results</text>
  <!-- Allocator <-> Dispatcher -->
  <line x1="935" y1="287" x2="1330" y2="234" stroke="#1f2937" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1150" y="276" class="lbl">candidates → choice</text>

  <!-- Main row -->
  <!-- User request -->
  <rect x="20" y="290" width="200" height="200" rx="12" fill="#e9f6ec" stroke="#3f8f57" stroke-width="1.6"/>
  <text x="120" y="325" text-anchor="middle" class="t">User Request</text>
  <text x="120" y="355" text-anchor="middle" class="b">Group-chat message</text>
  <text x="120" y="390" text-anchor="middle" class="s">e.g. “1,500 crewnecks</text>
  <text x="120" y="407" text-anchor="middle" class="s">to QuickStitch,</text>
  <text x="120" y="424" text-anchor="middle" class="s">need it by the 19th”</text>

  <line x1="222" y1="390" x2="266" y2="390" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>

  <!-- LLM Intake -->
  <rect x="270" y="290" width="255" height="200" rx="12" fill="#ede4fb" stroke="#7c4dcc" stroke-width="1.6"/>
  <text x="397" y="325" text-anchor="middle" class="t">LLM Intake</text>
  <text x="397" y="346" text-anchor="middle" class="s">GPT-4.1-mini · strict JSON · temp 0</text>
  <text x="288" y="377" class="b">• Extracts order, qty, date,</text>
  <text x="300" y="396" class="b">constraints &amp; who set them</text>
  <text x="288" y="420" class="b">• No maths, no decisions</text>
  <text x="288" y="444" class="b">• Python validates fields</text>
  <text x="300" y="463" class="b">against orders.csv</text>

  <line x1="527" y1="390" x2="586" y2="390" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="556" y="360" text-anchor="middle" class="lbl">structured</text>
  <text x="556" y="376" text-anchor="middle" class="lbl">request</text>

  <!-- Dispatcher -->
  <rect x="590" y="290" width="380" height="200" rx="12" fill="#fdf3d4" stroke="#c9a227" stroke-width="1.6"/>
  <text x="780" y="325" text-anchor="middle" class="t">Dispatcher (rule-based)</text>
  <text x="610" y="358" class="b">• Routes each request: allocate / clarify /</text>
  <text x="622" y="377" class="b">refuse / decline</text>
  <text x="610" y="402" class="b">• Calls tools; flags late or impossible orders</text>
  <text x="610" y="427" class="b">• Fills pre-written explanation templates</text>
  <text x="610" y="452" class="b">• Faithfulness check: every number in the</text>
  <text x="622" y="471" class="b">rationale must come from a tool output</text>

  <line x1="972" y1="390" x2="1061" y2="390" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1016" y="360" text-anchor="middle" class="lbl">recommended</text>
  <text x="1016" y="376" text-anchor="middle" class="lbl">workshop</text>

  <!-- Human review -->
  <rect x="1065" y="290" width="230" height="200" rx="12" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.6"/>
  <text x="1180" y="325" text-anchor="middle" class="t">Human Review</text>
  <text x="1180" y="346" text-anchor="middle" class="s">Streamlit app</text>
  <text x="1080" y="380" class="b">• Sees candidates, ETA,</text>
  <text x="1092" y="399" class="b">cost at a glance</text>
  <text x="1080" y="424" class="b">• Dispatcher confirms</text>
  <text x="1080" y="449" class="b">• Never auto-dispatches</text>

  <line x1="1297" y1="390" x2="1341" y2="390" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1319" y="377" text-anchor="middle" class="lbl">confirm</text>

  <!-- Decision log -->
  <rect x="1345" y="290" width="235" height="200" rx="12" fill="#e9f6ec" stroke="#3f8f57" stroke-width="1.6"/>
  <text x="1460" y="325" text-anchor="middle" class="t">Decision Log</text>
  <text x="1460" y="346" text-anchor="middle" class="s">audit record (JSONL)</text>
  <text x="1358" y="380" class="b">• Who · what · why · when</text>
  <text x="1358" y="405" class="b">• All candidates &amp; their</text>
  <text x="1370" y="424" class="b">ETA / cost</text>
  <text x="1358" y="449" class="b">• Constraints &amp; who set them</text>

  <!-- Dispatcher <-> Memory -->
  <line x1="780" y1="494" x2="780" y2="556" stroke="#1f2937" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Data & memory -->
  <rect x="660" y="560" width="240" height="125" rx="12" fill="#fde8ec" stroke="#c2415d" stroke-width="1.6"/>
  <text x="780" y="590" text-anchor="middle" class="t">Data &amp; Memory</text>
  <text x="678" y="618" class="b">• orders.csv · workshops.csv</text>
  <text x="678" y="642" class="b">• objective config (YAML)</text>
  <text x="678" y="666" class="b">• allocation history</text>

  <!-- Feedback loop: dispatcher -> user -->
  <path d="M620,492 L620,718 L120,718 L120,496" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrg)"/>
  <text x="370" y="709" text-anchor="middle" class="lbl" fill="#4b5563">clarifying question / refusal with reason + alternative</text>

  <!-- Evaluation -->
  <rect x="20" y="745" width="1560" height="140" rx="12" fill="#f7f8fa" stroke="#9aa5b1" stroke-dasharray="6 5"/>
  <text x="800" y="771" text-anchor="middle" class="h">Evaluation</text>

  <rect x="40" y="783" width="750" height="88" rx="8" fill="#ffffff" stroke="#9db4d3"/>
  <text x="58" y="808" class="tt">A. Decisions — shared simulator</text>
  <rect x="300" y="794" width="54" height="20" rx="10" fill="#dff3e4" stroke="#3f8f57"/>
  <text x="327" y="808" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2d6b40">Done</text>
  <text x="58" y="833" class="b">120 orders → same Allocator → course simulator (normal + shock, 10 seeds)</text>
  <text x="58" y="856" class="b">% late, defects, cost, fairness vs random · greedy · cheapest · earliest-finish</text>

  <rect x="810" y="783" width="750" height="88" rx="8" fill="#ffffff" stroke="#9db4d3"/>
  <text x="828" y="808" class="tt">B. Language — chat inbox</text>
  <rect x="1022" y="794" width="74" height="20" rx="10" fill="#fdf3d4" stroke="#c9a227"/>
  <text x="1059" y="808" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a6d12">Sprint 2</text>
  <text x="828" y="833" class="b">30 inbox requests + held-out set → LLM Intake → Dispatcher</text>
  <text x="828" y="856" class="b">Scored vs human labels by behaviour; decision &amp; explanation judged separately</text>

  <!-- Tech stack -->
  <text x="20" y="925" font-size="14" fill="#374151"><tspan font-weight="700">Tech stack: </tspan>Python 3.11 · OpenAI API (GPT-4.1-mini) · Pydantic (schema) · pandas · Streamlit (UI) · YAML (objective config) · JSONL (audit log) · pytest</text>
</svg>
