<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="945" viewBox="0 0 1600 945" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<style>
.t{font-size:19px;font-weight:700;fill:#111827}
.b{font-size:13.5px;fill:#1f2937}
.b2{font-size:12.5px;fill:#1f2937}
.s{font-size:12px;fill:#4b5563}
.tn{font-weight:700;fill:#1e3a5f}
.tag{font-size:12.5px;font-weight:700;fill:#1f2937}
.lbl{font-size:12.5px;fill:#374151}
.h{font-size:17px;font-weight:700;fill:#1e3a5f}
.mt{font-size:13px;font-weight:700;fill:#1e3a5f}
</style></defs>
<rect width="1600" height="945" fill="#ffffff"/>
<text x="20" y="40" font-size="26" font-weight="700" fill="#1e3a5f">System Architecture — LLM Intake + Rule-Based Dispatcher</text>
<rect x="1130" y="22" width="18" height="18" rx="3" fill="#ede4fb" stroke="#7c4dcc" stroke-width="1.2"/>
<text x="1155" y="36" class="lbl">LLM</text>
<rect x="1200" y="22" width="18" height="18" rx="3" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.2"/>
<text x="1225" y="36" class="lbl">Rule-based (no LLM)</text>
<rect x="1380" y="22" width="18" height="18" rx="3" fill="#fff1e0" stroke="#d98a2b" stroke-width="1.2"/>
<text x="1405" y="36" class="lbl">Human</text>
<rect x="20" y="66" width="236" height="222" rx="12" fill="#e9f6ec" stroke="#3f8f57" stroke-width="1.6"/>
<circle cx="44" cy="94" r="13" fill="#1e3a5f"/>
<text x="44" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
<text x="66" y="100" class="t">User request</text>
<text x="36" y="138" class="b">Group-chat message</text>
<text x="36" y="170" class="s">e.g. “ORD-045, 150 vests for</text>
<text x="36" y="187" class="s">Cotton Club, due Apr 09.</text>
<text x="36" y="204" class="s">Urgent, fastest turnaround.”</text>
<text x="36" y="256" class="s">Typed into the Streamlit app</text>
<rect x="282" y="66" width="270" height="222" rx="12" fill="#ede4fb" stroke="#7c4dcc" stroke-width="1.6"/>
<circle cx="306" cy="94" r="13" fill="#1e3a5f"/>
<text x="306" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
<text x="328" y="100" class="t">LLM Intake</text>
<text x="298" y="124" class="s">GPT-4.1-mini · strict JSON · temp 0</text>
<text x="298" y="156" class="b">• Extracts order, quantity,</text>
<text x="298" y="175" class="b">  deadline wording, workshop</text>
<text x="298" y="194" class="b">  named, preference, and who</text>
<text x="298" y="213" class="b">  set each instruction</text>
<text x="298" y="256" class="b">• No maths, no decisions</text>
<rect x="578" y="66" width="330" height="222" rx="12" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.6"/>
<circle cx="602" cy="94" r="13" fill="#1e3a5f"/>
<text x="602" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
<text x="624" y="100" class="t">Python validates</text>
<text x="594" y="124" class="s">rule-based checks on the LLM output</text>
<text x="594" y="148" class="b">• Finds the order in orders.csv;</text>
<text x="594" y="166" class="b">  details come from the file</text>
<text x="594" y="184" class="b">• Turns the deadline into a date;</text>
<text x="594" y="202" class="b">  flags it if already late</text>
<text x="594" y="220" class="b">• Checks a suggested workshop</text>
<text x="594" y="238" class="b">  with <tspan class="tn">Eligibility</tspan></text>
<text x="594" y="256" class="b">• <tspan class="tn">Decides the request type:</tspan></text>
<text x="594" y="274" class="b">  decline · clarify · refuse · allocate</text>
<rect x="960" y="66" width="596" height="222" rx="12" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.6"/>
<circle cx="984" cy="94" r="13" fill="#1e3a5f"/>
<text x="984" y="99" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
<text x="1006" y="100" class="t">Dispatcher acts on the request type</text>
<rect x="974" y="118" width="568" height="36" rx="8" fill="#ffffff" stroke="#b9cbe3" stroke-width="1"/>
<rect x="980" y="123" width="84" height="26" rx="6" fill="#fbe3e7" stroke="#9aa5b1" stroke-width="1"/>
<text x="1022" y="141" class="tag" text-anchor="middle">Decline</text>
<text x="1074" y="141" class="b2">Order not found, or data we don't hold → says so, no allocation</text>
<rect x="974" y="160" width="568" height="36" rx="8" fill="#ffffff" stroke="#b9cbe3" stroke-width="1"/>
<rect x="980" y="165" width="84" height="26" rx="6" fill="#fdf3d4" stroke="#9aa5b1" stroke-width="1"/>
<text x="1022" y="183" class="tag" text-anchor="middle">Clarify</text>
<text x="1074" y="183" class="b2">Unclear order / missing detail → <tspan class="tn">Order Lookup</tspan> → question</text>
<rect x="974" y="202" width="568" height="36" rx="8" fill="#ffffff" stroke="#b9cbe3" stroke-width="1"/>
<rect x="980" y="207" width="84" height="26" rx="6" fill="#fde7d3" stroke="#9aa5b1" stroke-width="1"/>
<text x="1022" y="225" class="tag" text-anchor="middle">Refuse</text>
<text x="1074" y="225" class="b2">Workshop not allowed → <tspan class="tn">Eligibility</tspan> → reason + alternative</text>
<rect x="974" y="244" width="568" height="36" rx="8" fill="#ffffff" stroke="#b9cbe3" stroke-width="1"/>
<rect x="980" y="249" width="84" height="26" rx="6" fill="#dff3e4" stroke="#9aa5b1" stroke-width="1"/>
<text x="1022" y="267" class="tag" text-anchor="middle">Allocate</text>
<text x="1074" y="267" class="b2">All details valid → continue to step 5</text>
<line x1="258" y1="177" x2="280" y2="177" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<line x1="554" y1="177" x2="576" y2="177" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<line x1="910" y1="177" x2="958" y2="177" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<text x="934" y="146" class="s" text-anchor="middle">request</text>
<text x="934" y="160" class="s" text-anchor="middle">type</text>
<path d="M1100,288 L1100,308 L80,308 L80,290" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrg)"/>
<text x="590" y="302" class="lbl" text-anchor="middle">Decline / Clarify / Refuse → reply goes back to the sender (nothing is allocated)</text>
<path d="M1480,288 L1480,330 L138,330 L138,354" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<text x="820" y="346" class="lbl" text-anchor="middle">Allocate path</text>
<rect x="20" y="356" width="236" height="210" rx="12" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.6"/>
<circle cx="44" cy="384" r="13" fill="#1e3a5f"/>
<text x="44" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
<text x="66" y="390" class="t">Build options</text>
<text x="36" y="412" class="s">Allocator calls Candidate List:</text>
<text x="36" y="436" class="b2">• <tspan class="tn">Eligibility</tspan> – who can take it</text>
<text x="36" y="454" class="b2">• <tspan class="tn">ETA Estimate</tspan> – queue +</text>
<text x="36" y="472" class="b2">  making time + transport</text>
<text x="36" y="490" class="b2">• <tspan class="tn">Cost Estimate</tspan> – pieces × rate</text>
<text x="36" y="508" class="b2">• Skips workshops the sender</text>
<text x="36" y="526" class="b2">  excluded</text>
<text x="36" y="552" class="b2">→ table of eligible options</text>
<rect x="280" y="356" width="236" height="210" rx="12" fill="#dbe8f8" stroke="#2f5f9e" stroke-width="1.6"/>
<circle cx="304" cy="384" r="13" fill="#1e3a5f"/>
<text x="304" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
<text x="326" y="390" class="t">Allocator picks</text>
<text x="296" y="412" class="s">scores every option</text>
<text x="296" y="436" class="b2">• Uses the objective weights</text>
<text x="296" y="454" class="b2">  from the config file</text>
<text x="296" y="472" class="b2">• Lowest score wins</text>
<text x="296" y="490" class="b2">• None on time? Picks the</text>
<text x="296" y="508" class="b2">  least-late, flags for review</text>
<text x="296" y="526" class="b2">• <tspan class="tn">Closure monitor</tspan> flags</text>
<text x="296" y="544" class="b2">  queues not going down</text>
<rect x="540" y="356" width="236" height="210" rx="12" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.6"/>
<circle cx="564" cy="384" r="13" fill="#1e3a5f"/>
<text x="564" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
<text x="586" y="390" class="t">Add evidence</text>
<text x="556" y="412" class="s">after the workshop is chosen</text>
<text x="556" y="436" class="b2">• <tspan class="tn">Queue Check</tspan> – how busy</text>
<text x="556" y="454" class="b2">  the chosen workshop is</text>
<text x="556" y="472" class="b2">• <tspan class="tn">Overload Probe</tspan> – its queue</text>
<text x="556" y="490" class="b2">  after taking this batch</text>
<text x="556" y="508" class="b2">• <tspan class="tn">Split Estimate</tspan> – only if</text>
<text x="556" y="526" class="b2">  the sender allows splitting</text>
<text x="556" y="544" class="b2">  (preview only)</text>
<rect x="800" y="356" width="236" height="210" rx="12" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.6"/>
<circle cx="824" cy="384" r="13" fill="#1e3a5f"/>
<text x="824" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">8</text>
<text x="846" y="390" class="t">Explain &amp; check</text>
<text x="816" y="412" class="s">no LLM writes this text</text>
<text x="816" y="436" class="b2">• Pre-written template,</text>
<text x="816" y="454" class="b2">  numbers copied from tools</text>
<text x="816" y="472" class="b2">• Late / impossible-deadline</text>
<text x="816" y="490" class="b2">  warnings added on top</text>
<text x="816" y="508" class="b2">• <tspan class="tn">Number check</tspan>: blocks any</text>
<text x="816" y="526" class="b2">  number not from a tool</text>
<rect x="1060" y="356" width="236" height="210" rx="12" fill="#fff1e0" stroke="#d98a2b" stroke-width="1.6"/>
<circle cx="1084" cy="384" r="13" fill="#1e3a5f"/>
<text x="1084" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">9</text>
<text x="1106" y="390" class="t">Human review</text>
<text x="1076" y="412" class="s">Streamlit app</text>
<text x="1076" y="436" class="b2">• Sees recommendation, all</text>
<text x="1076" y="454" class="b2">  options, ETA, cost, risk</text>
<text x="1076" y="472" class="b2">• Sees rejected workshops</text>
<text x="1076" y="490" class="b2">  and why</text>
<text x="1076" y="508" class="b2">• Dispatcher confirms</text>
<text x="1076" y="526" class="b2">• Never auto-dispatches</text>
<rect x="1320" y="356" width="236" height="210" rx="12" fill="#e9f6ec" stroke="#3f8f57" stroke-width="1.6"/>
<circle cx="1344" cy="384" r="13" fill="#1e3a5f"/>
<text x="1344" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">10</text>
<text x="1366" y="390" class="t">Decision log</text>
<text x="1336" y="412" class="s">audit record (JSONL)</text>
<text x="1336" y="436" class="b2">• Saved only after Confirm</text>
<text x="1336" y="454" class="b2">• Who asked + constraints</text>
<text x="1336" y="472" class="b2">• All candidates + numbers</text>
<text x="1336" y="490" class="b2">• Why this workshop won</text>
<text x="1336" y="508" class="b2">• When it was decided</text>
<line x1="258" y1="461" x2="278" y2="461" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<line x1="518" y1="461" x2="538" y2="461" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<line x1="778" y1="461" x2="798" y2="461" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<line x1="1038" y1="461" x2="1058" y2="461" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<line x1="1298" y1="461" x2="1318" y2="461" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<rect x="20" y="582" width="1536" height="40" rx="8" fill="#fde8ec" stroke="#c2415d" stroke-width="1.4"/>
<text x="36" y="607" class="b2"><tspan class="tn">Data &amp; memory</tspan>  ·  orders.csv  ·  workshops.csv (queues, status, caps)  ·  objective config (YAML)  ·  allocation history (this session)   —   read by steps 3 to 7</text>
<line x1="138" y1="566" x2="138" y2="582" stroke="#c2415d" stroke-width="2"/>
<line x1="398" y1="566" x2="398" y2="582" stroke="#c2415d" stroke-width="2"/>
<line x1="658" y1="566" x2="658" y2="582" stroke="#c2415d" stroke-width="2"/>
<rect x="20" y="642" width="1536" height="252" rx="12" fill="#f7f8fa" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="788" y="668" class="h" text-anchor="middle">Evaluation — two separate tests</text>
<rect x="36" y="682" width="748" height="196" rx="8" fill="#ffffff" stroke="#9db4d3" stroke-width="1.2"/>
<text x="52" y="706" class="mt">A · Are the decisions good?  (course simulator)</text>
<text x="52" y="860" class="s">Tests the Allocator (steps 5–6). No LLM involved.</text>
<rect x="52" y="720" width="158" height="112" rx="8" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.2"/>
<text x="62" y="742" class="mt">120 orders</text>
<text x="62" y="762.0" class="s">from orders.csv,</text>
<text x="62" y="777.5" class="s">replayed in date order</text>
<line x1="212" y1="776" x2="236" y2="776" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<rect x="238" y="720" width="158" height="112" rx="8" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.2"/>
<text x="248" y="742" class="mt">Same Allocator</text>
<text x="248" y="762.0" class="s">picks a workshop for</text>
<text x="248" y="777.5" class="s">each order</text>
<line x1="398" y1="776" x2="422" y2="776" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<rect x="424" y="720" width="158" height="112" rx="8" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.2"/>
<text x="434" y="742" class="mt">Simulator</text>
<text x="434" y="762.0" class="s">queue wait, making time,</text>
<text x="434" y="777.5" class="s">transport, random</text>
<text x="434" y="793.0" class="s">defects; normal + shock</text>
<text x="434" y="808.5" class="s">(workshop closes 2 wks);</text>
<text x="434" y="824.0" class="s">10 seeds, averaged</text>
<line x1="584" y1="776" x2="608" y2="776" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<rect x="610" y="720" width="158" height="112" rx="8" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.2"/>
<text x="620" y="742" class="mt">Compare vs baselines</text>
<text x="620" y="762.0" class="s">random · biggest ·</text>
<text x="620" y="777.5" class="s">cheapest · earliest-</text>
<text x="620" y="793.0" class="s">finish on % late, late</text>
<text x="620" y="808.5" class="s">days, defects, cost,</text>
<text x="620" y="824.0" class="s">fairness</text>
<rect x="800" y="682" width="740" height="196" rx="8" fill="#ffffff" stroke="#9db4d3" stroke-width="1.2"/>
<text x="816" y="706" class="mt">B · Does it understand chat?  (inbox requests)</text>
<text x="816" y="860" class="s">Tests the whole chain (steps 1–8). Decision and explanation scored separately.</text>
<rect x="820" y="720" width="154" height="112" rx="8" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.2"/>
<text x="830" y="742" class="mt">30 + new requests</text>
<text x="830" y="762.0" class="s">30 inbox messages +</text>
<text x="830" y="777.5" class="s">10+ unseen ones</text>
<text x="830" y="793.0" class="s">(held-out set)</text>
<line x1="976" y1="776" x2="1000" y2="776" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1002" y="720" width="154" height="112" rx="8" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.2"/>
<text x="1012" y="742" class="mt">Human labels</text>
<text x="1012" y="762.0" class="s">two reviewers write the</text>
<text x="1012" y="777.5" class="s">correct response, then</text>
<text x="1012" y="793.0" class="s">agree, before scoring</text>
<line x1="1158" y1="776" x2="1182" y2="776" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1184" y="720" width="154" height="112" rx="8" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.2"/>
<text x="1194" y="742" class="mt">Full pipeline</text>
<text x="1194" y="762.0" class="s">each message goes</text>
<text x="1194" y="777.5" class="s">through LLM Intake</text>
<text x="1194" y="793.0" class="s">→ Dispatcher</text>
<line x1="1340" y1="776" x2="1364" y2="776" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1366" y="720" width="154" height="112" rx="8" fill="#e6f0fb" stroke="#4a78b5" stroke-width="1.2"/>
<text x="1376" y="742" class="mt">Score by type</text>
<text x="1376" y="762.0" class="s">recommend · ask ·</text>
<text x="1376" y="777.5" class="s">refuse · can't answer;</text>
<text x="1376" y="793.0" class="s">invented numbers = fail</text>
<text x="20" y="925" font-size="14" fill="#374151"><tspan font-weight="700">Tech stack: </tspan>Python 3.11 · OpenAI API (GPT-4.1-mini) · Pydantic (schema) · pandas · Streamlit (UI) · YAML (objective config) · JSONL (audit log) · pytest</text>
</svg>